name: Release Approve - Promote Image

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  promote-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull RC image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-sabrine:1.0.0-RC1

      - name: Retag and push stable image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-sabrine:1.0.0-RC1 ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-sabrine:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-sabrine:1.0.0

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "Release version 1.0.0"
          git push origin v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

